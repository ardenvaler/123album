<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Metis Control Center</title>
  <meta name="description" content="Personal work control center: projects, updates, data, and reminders with natural-language search.">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%230894ff'/%3E%3Cstop offset='.5' stop-color='%23c959dd'/%3E%3Cstop offset='1' stop-color='%23ff9004'/%3E%3C/linearGradient%3E%3C/defs%3E%3Ccircle cx='32' cy='32' r='26' fill='url(%23g)'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- Apply saved theme before paint so there is no flash -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem('metis.theme');
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <!-- Ambient background -->
  <div class="ambient" aria-hidden="true">
    <div class="blob b1"></div>
    <div class="blob b2"></div>
    <div class="blob b3"></div>
    <div class="blob b4"></div>
    <div class="grain"></div>
  </div>

  <header class="nav" id="nav">
    <a class="brand" href="#" data-action="home" aria-label="Metis home">
      <span class="brand-mark" aria-hidden="true"></span>
      <span class="brand-name">Metis</span>
    </a>
    <div class="nav-mini-search" id="navSearchSlot"></div>
    <div class="nav-actions">
      <button class="icon-btn" id="browseBtn" title="Browse everything" aria-label="Browse everything">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7.5" height="7.5" rx="2"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="2"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="2"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="2"/></svg>
      </button>
      <button class="icon-btn bell-btn" id="bellBtn" title="Reminders" aria-label="Show reminders">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 16.5V11a6 6 0 1 1 12 0v5.5l1.5 1.5h-15z"/><path d="M10 20.5a2 2 0 0 0 4 0"/></svg>
        <span class="bell-n" id="bellN"></span>
      </button>
      <button class="icon-btn" id="themeBtn" title="Toggle light / dark" aria-label="Toggle light or dark mode">
        <svg class="i-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><g class="rays"><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M5.3 18.7l1.6-1.6M17.1 6.9l1.6-1.6"/></g></svg>
        <svg class="i-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 14.6A8.6 8.6 0 0 1 9.4 3.5a8.6 8.6 0 1 0 11.1 11.1z"/></svg>
      </button>
      <button class="assistant-pill" id="assistantBtn" aria-label="Open assistant">
        <span class="orb sm" aria-hidden="true"><i></i><i></i><i></i></span>
        <span>Ask Metis</span>
      </button>
    </div>
  </header>

  <main id="main">
    <!-- HERO + SEARCH -->
    <section class="hero" id="hero">
      <p class="eyebrow reveal" id="todayLine">&nbsp;</p>
      <h1 class="headline reveal" id="greeting">Hello.</h1>
      <p class="subhead reveal" id="subhead">&nbsp;</p>

      <div class="search-wrap reveal" id="searchWrap">
        <form class="search" id="searchForm" role="search" autocomplete="off">
          <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 21 21"/></svg>
          <input id="q" type="search" spellcheck="false" aria-label="Search your work in plain English" placeholder="Ask anything…">
          <span class="kbd" aria-hidden="true">⌘K</span>
          <button type="button" class="clear-btn" id="clearBtn" aria-label="Clear search">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7l10 10M17 7 7 17"/></svg>
          </button>
        </form>
        <div class="understood" id="understood" aria-live="polite"></div>
        <div class="suggest" id="suggest" role="listbox" aria-label="Suggestions"></div>
      </div>
      <div class="quick-chips reveal" id="quickChips"></div>
    </section>

    <!-- CONTROL CENTER (landing) -->
    <section class="stage" id="stage" aria-live="polite">
      <div class="bento" id="bento"></div>
    </section>

    <!-- RESULTS -->
    <section class="results" id="results" hidden>
      <div class="answer" id="answer"></div>
      <div class="result-groups" id="resultGroups"></div>
    </section>

    <footer class="foot">
      <span id="footStats"></span>
      <span class="dot-sep">·</span>
      <span>Drop a CSV anywhere for instant analysis</span>
    </footer>
  </main>

  <!-- Detail sheet -->
  <div class="sheet-backdrop" id="sheetBackdrop" hidden></div>
  <article class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" hidden>
    <button class="sheet-close icon-btn" id="sheetClose" aria-label="Close">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7l10 10M17 7 7 17"/></svg>
    </button>
    <div class="sheet-body" id="sheetBody"></div>
  </article>

  <!-- Assistant -->
  <aside class="assistant" id="assistant" aria-label="Metis assistant" hidden>
    <div class="assistant-head">
      <span class="orb" aria-hidden="true"><i></i><i></i><i></i></span>
      <div>
        <strong>Metis</strong>
        <small>Searches and summarizes your data — on this device</small>
      </div>
      <button class="icon-btn" id="assistantClose" aria-label="Close assistant">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7l10 10M17 7 7 17"/></svg>
      </button>
    </div>
    <div class="assistant-log" id="assistantLog"></div>
    <form class="assistant-input" id="assistantForm" autocomplete="off">
      <input id="assistantQ" type="text" placeholder="Ask, or “remind me to … on Friday”" aria-label="Message Metis">
      <button type="submit" aria-label="Send">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5M5.5 11.5 12 5l6.5 6.5"/></svg>
      </button>
    </form>
  </aside>

  <!-- Notification banners (reminders) -->
  <div class="banners" id="banners" aria-live="assertive"></div>

  <!-- Drop overlay -->
  <div class="drop" id="drop" hidden><div><span class="orb lg" aria-hidden="true"><i></i><i></i><i></i></span><p>Drop CSV to analyze</p></div></div>

  <!-- Shared chart tooltip -->
  <div class="tip" id="tip" role="tooltip" hidden></div>

  <!-- Core engine -->
  <script src="assets/js/core/metis.js"></script>
  <script src="assets/js/core/text.js"></script>
  <script src="assets/js/core/dates.js"></script>
  <script src="assets/js/core/analyze.js"></script>
  <script src="assets/js/core/store.js"></script>
  <script src="assets/js/core/query.js"></script>
  <script src="assets/js/core/reminders.js"></script>
  <script src="assets/js/core/insights.js"></script>

  <!-- Your data: one file per kind. See data/README.md -->
  <script src="data/projects.js"></script>
  <script src="data/updates.js"></script>
  <script src="data/tables.js"></script>
  <script src="data/metrics.js"></script>
  <script src="data/reminders.js"></script>
  <script src="data/notes.js"></script>

  <!-- UI -->
  <script src="assets/js/ui/charts.js"></script>
  <script src="assets/js/ui/render.js"></script>
  <script src="assets/js/ui/assistant.js"></script>
  <script src="assets/js/ui/app.js"></script>
</body>
</html>
